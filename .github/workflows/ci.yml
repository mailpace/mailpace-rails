name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rails ${{ matrix.rails }} (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-24.04
    env:
      BUNDLE_JOBS: "3"
      BUNDLE_RETRY: "3"
      RAILS_ENV: test
      RAILS_TEST_VERSION: ${{ matrix.rails }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "3.1"
            rails: "6.1.7.10"
          - ruby: "3.1"
            rails: "7.0.10"
          - ruby: "3.2"
            rails: "7.2.4"
          - ruby: "3.4"
            rails: "8.0.5.1"
          - ruby: "3.4"
            rails: "8.1.4"
    steps:
      - uses: actions/checkout@v5

      - name: Install SQLite development headers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libsqlite3-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      # The Gemfile has version-specific dependencies (see the sqlite3 /
      # concurrent-ruby guards), so a single committed Gemfile.lock cannot
      # satisfy every Rails version. Re-resolve for each matrix entry.
      - name: Install dependencies
        run: bundle update

      - name: Run tests
        run: bin/test
